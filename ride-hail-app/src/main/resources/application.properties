spring.application.name=ride-hail-app

# Server Configuration
server.port=8080
# Static resources are served from classpath:/static/ by default

# Allow bean overriding (for custom Redis templates)
spring.main.allow-bean-definition-overriding=true

# DevTools Configuration (for hot reloading)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# Database Configuration
# For production, use MySQL/Postgres. For development, H2 is used by default
# To use MySQL, uncomment the MySQL configuration and comment out H2

# MySQL Configuration (for production)
# spring.datasource.url=jdbc:mysql://localhost:3306/ride_hail_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP - for high throughput)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# H2 Database (for development/testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# Redis Configuration (for caching and idempotency)
# Comment out to disable Redis (for development without Redis)
# Uncomment when Redis is available:
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.timeout=2000ms
# spring.data.redis.password=

# Disable Redis and Kafka auto-configuration when not available
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Use simple cache (in-memory) if Redis is not available
spring.cache.type=simple
# spring.cache.type=redis
# spring.cache.redis.time-to-live=300000

# Kafka Configuration (for async messaging)
# If Kafka is not available, notifications will fail gracefully
# Comment out or remove these lines if Kafka is not running
# spring.kafka.bootstrap-servers=localhost:9092
# spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# spring.kafka.consumer.group-id=ride-hail-app-group
# spring.kafka.consumer.auto-offset-reset=earliest

# H2 Console (for viewing database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# New Relic Configuration
# Get your API key from: https://one.newrelic.com/admin-portal/api-keys/home
# Disable for development if New Relic is not configured
management.newrelic.metrics.export.enabled=false
# management.newrelic.metrics.export.api-key=${NEW_RELIC_API_KEY:your-api-key-here}
# management.newrelic.metrics.export.account-id=${NEW_RELIC_ACCOUNT_ID:your-account-id-here}
management.newrelic.metrics.export.uri=https://metric-api.newrelic.com/metric/v1
management.metrics.export.newrelic.step=10s
management.metrics.export.newrelic.num-threads=2
management.metrics.export.newrelic.connect-timeout=1s
management.metrics.export.newrelic.read-timeout=10s

# New Relic Application Name
newrelic.config.app_name=${NEW_RELIC_APP_NAME:ride-hail-app}
newrelic.config.environment=${NEW_RELIC_ENVIRONMENT:development}

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.metrics.export.prometheus.enabled=true

# Thread pool configuration for async processing
spring.task.execution.pool.core-size=20
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=async-exec-
